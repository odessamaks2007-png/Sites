<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>My To Do List</title>
    <link rel="stylesheet" href="number2.css">
</head>
<body>

    <div class="todo-container">
        <h2>My To Do List</h2>
        
        <ul class="todo-list">
            <!-- Неотмеченные задачи -->
            <li>
                <img src="unchecked_16.png" alt="box" class="icon">
                <span class="task-text">Hit the gym</span>
                <span class="delete-btn">&times;</span>
            </li>

            <li class="checked">
                <img src="checked_16.png" alt="checked" class="icon">
